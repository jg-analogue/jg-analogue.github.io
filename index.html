<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Johannes Gundy – Photography</title>
<meta name="description" content="Event, party and film photography by Johannes Gundy.">
<style>
:root{--bg:#0b0b0b;--fg:#fff;--dim:#9a9a9a;--line:#262626;--gap:clamp(8px,1.4vw,18px);--pad:clamp(18px,4vw,56px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.35}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:14px var(--pad);background:rgba(11,11,11,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;text-decoration:none;font-size:1.05rem}
.top nav{display:flex;gap:1.4rem;flex-wrap:wrap;font-size:.95rem}
.top nav a{text-decoration:none;color:var(--dim)}
.top nav a:hover{color:var(--fg)}

.intro{display:flex;justify-content:space-between;align-items:center;gap:var(--pad);padding:clamp(28px,5vw,64px) var(--pad)}
.intro h1{font-size:clamp(2.6rem,8vw,6rem);line-height:1;font-weight:700;letter-spacing:-.01em}
.intro p{margin-top:1rem;max-width:34ch;color:var(--dim);font-size:clamp(1rem,1.6vw,1.2rem)}
.frame{flex:none;width:clamp(110px,16vw,170px);background:#fff;padding:8px;box-shadow:0 0 16px rgba(255,255,255,.1)}
.frame img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#151515}

.series{padding:clamp(28px,5vw,64px) var(--pad);border-top:1px solid var(--line)}
.series header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:clamp(16px,2.5vw,32px)}
.series h2{font-size:clamp(1.6rem,4vw,2.8rem);font-weight:700;line-height:1.05}
.series .note{color:var(--dim);font-size:1rem}
.grid{columns:3 280px;column-gap:var(--gap)}
.grid button{display:block;width:100%;margin:0 0 var(--gap);padding:0;border:0;background:#151515;cursor:zoom-in;break-inside:avoid}
.grid img{display:block;width:100%;height:auto;min-height:120px}
.msg{padding:var(--pad);color:var(--dim)}

.contact{padding:clamp(36px,6vw,80px) var(--pad);border-top:1px solid var(--line)}
.contact h2{font-size:clamp(1.6rem,4vw,2.8rem);margin-bottom:.8rem}
.contact p{color:var(--dim);max-width:40ch;margin-bottom:1.4rem}
.contact .links{display:flex;flex-wrap:wrap;gap:.6rem 2rem;font-size:1.15rem;font-weight:700}

dialog{border:0;background:rgba(0,0,0,.96);color:#fff;width:100vw;height:100vh;max-width:none;max-height:none;padding:0}
dialog::backdrop{background:#000}
dialog .stage{height:100%;display:grid;place-items:center;padding:4vmin}
dialog img{max-width:100%;max-height:92vh;object-fit:contain}
dialog button{position:fixed;background:none;border:0;color:#fff;font:inherit;font-size:1.05rem;padding:1rem;cursor:pointer}
#close{top:0;right:0}#prev{left:0;top:50%}#next{right:0;top:50%}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="#top">Johannes Gundy</a>
  <nav aria-label="Sections" id="nav"></nav>
</div>

<section class="intro" id="top">
  <div>
    <h1>Photography</h1>
    <p>Event, party and film photography. Digital and analogue.</p>
  </div>
  <div class="frame"><img src="images/cover.jpg" alt="" width="400" height="600"></div>
</section>

<main id="main"></main>

<section class="contact" id="contact">
  <h2>Get in touch</h2>
  <p>Available for balls, parties and events. Email for dates and rates.</p>
  <div class="links">
    <a href="mailto:jg2156@cam.ac.uk">jg2156@cam.ac.uk</a>
    <a href="https://instagram.com/jg_analogue" target="_blank" rel="noopener">@jg_analogue</a>
  </div>
</section>

<dialog id="lb" aria-label="Photo viewer">
  <div class="stage"><img id="lbimg" alt=""></div>
  <button id="close" aria-label="Close">Close</button>
  <button id="prev" aria-label="Previous photo">Prev</button>
  <button id="next" aria-label="Next photo">Next</button>
</dialog>

<script>
/* EDIT THIS: one line per section, in the order you want them shown.
   "folder" is the folder name inside images/. Photos are found automatically. */
const SECTIONS = [
  { title:"Trinity Hall May Ball 2026", note:"Events",   folder:"trinity-hall-may-ball-2026" },
  { title:"Jesus May Ball 2025",        note:"Events",   folder:"jesus-may-ball-2025" },
  { title:"Digital",                    note:"Digital",  folder:"digital" },
  { title:"Film",                       note:"Analogue", folder:"film" }
];

const main = document.getElementById("main"), nav = document.getElementById("nav");
const flat = [];

const REPO = "jg-analogue/jg-analogue.github.io", BRANCH = "main";
const EXT = /\.(jpe?g|png|webp|avif|gif)$/i;
const nat = (a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"});

/* Lists images/<folder>/<file> straight from the repo, so dropping photos in a folder is enough */
function fromTree(t){
  const m = {};
  (t.tree || []).forEach(x=>{
    const p = x.path.split("/");
    if(x.type==="blob" && p.length===3 && p[0]==="images" && EXT.test(p[2])) (m[p[1]] = m[p[1]] || []).push(p[2]);
  });
  Object.values(m).forEach(a=>a.sort(nat));
  return m;
}
const getJSON = u => fetch(u).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });

getJSON(`https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`).then(fromTree)
  .catch(() => getJSON("photos.json"))
  .then(build)
  .catch(() => {
    main.innerHTML = '<p class="msg">Photos could not be loaded right now. Please try again shortly.</p>';
    addContact();
  });

function build(manifest){
  SECTIONS.forEach(s=>{
    const files = manifest[s.folder] || [];
    if(!files.length) return;
    const id = s.folder;

    const a = document.createElement("a"); a.href = "#"+id; a.textContent = s.title; nav.append(a);

    const sec = document.createElement("section"); sec.className = "series"; sec.id = id;
    const head = document.createElement("header");
    const h = document.createElement("h2"); h.textContent = s.title;
    head.append(h);
    if(s.note){ const n = document.createElement("p"); n.className = "note"; n.textContent = s.note; head.append(n); }

    const grid = document.createElement("div"); grid.className = "grid";
    files.forEach((f,k)=>{
      const src = `images/${s.folder}/${encodeURIComponent(f)}`;
      const label = `${s.title}, photo ${k+1} of ${files.length}`;
      const i = flat.push({src, label}) - 1;
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label","Open "+label);
      const im = new Image(); im.src = src; im.alt = ""; im.loading = "lazy"; im.decoding = "async";
      b.append(im); b.addEventListener("click",()=>openLb(i)); grid.append(b);
    });
    sec.append(head, grid); main.append(sec);
  });
  addContact();
}
function addContact(){
  const c = document.createElement("a"); c.href = "#contact"; c.textContent = "Contact"; nav.append(c);
}

const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
let cur = 0;
function show(i){ cur = (i+flat.length)%flat.length; lbimg.src = flat[cur].src; lbimg.alt = flat[cur].label; }
function openLb(i){ show(i); lb.showModal(); }
document.getElementById("close").onclick = ()=>lb.close();
document.getElementById("prev").onclick = ()=>show(cur-1);
document.getElementById("next").onclick = ()=>show(cur+1);
lb.addEventListener("click",e=>{ if(e.target===lb || e.target.classList.contains("stage")) lb.close(); });
lb.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") show(cur-1); if(e.key==="ArrowRight") show(cur+1); });
let x0=null;
lb.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{ if(x0===null) return; const d=e.changedTouches[0].clientX-x0; if(Math.abs(d)>50) show(cur+(d<0?1:-1)); x0=null; });
</script>
</body>
</html>
